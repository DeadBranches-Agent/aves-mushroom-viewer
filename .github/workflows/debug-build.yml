name: Debug build

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App flavor to build'
        type: choice
        default: 'play'
        options:
          - play
          - izzy
          - libre

# Declare default permissions as read only.
permissions: read-all

jobs:
  build_debug:
    name: Debug APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Building relies on the Android Gradle plugin,
      # which requires a modern Java version (not the default one).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter packages
        run: ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      # Debug builds are signed with the auto-generated debug keystore,
      # so no signing secrets are required.
      - name: Build debug APK
        run: |
          scripts/apply_flavor_${{ inputs.flavor }}.sh
          ./flutterw build apk --debug -t lib/main_${{ inputs.flavor }}.dart --flavor ${{ inputs.flavor }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aves-${{ inputs.flavor }}-debug-apk
          path: build/app/outputs/apk/${{ inputs.flavor }}/debug/*.apk
